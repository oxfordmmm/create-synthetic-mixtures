# mix_pipeline/environment.yaml — environment to launch the pipeline itself
#
# This only provides Nextflow. Each process resolves its own tool env on the fly
# via conda.enabled=true (see nextflow.config + envs/*.yml) — you don't need
# to install minimap2/samtools/seqtk/etc. into this env.
#
# Setup:  conda env create -f environment.yaml
# Usage:  conda activate mix_pipeline
name: mix_pipeline
channels:
  - bioconda
  - conda-forge
  - defaults
dependencies:
  - nextflow=26.04
